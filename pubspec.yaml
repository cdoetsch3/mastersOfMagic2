name: masters_of_magic_2
description: "Masters of Magic 2 — a simultaneous-turn elemental mage-duel game."
publish_to: 'none'

# Keep in sync with lib/game/app_version.dart (shown on the About panel).
version: 0.13.0+27

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.0
  mom_engine:
    path: packages/mom_engine
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  http: ^1.6.0
  # QR for room-code join — renders locally, no network fetch.
  qr_flutter: ^4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # ⚠️ The first image assets in the project. Everything else is a
  # CustomPainter (README §4) and stays that way — the map, the mage, every
  # combat effect. A bestiary of 275 creatures is what hand-placed pixels
  # could not carry.
  #
  # ⚠️ Declared per directory, and a declared directory must EXIST — hence the
  # .gitkeep files. Not recursive: a new zone needs a line here.
  #
  # ⚠️ **Git does not track an empty directory**, so a bare `mkdir` here works
  # on this machine and breaks the build on a fresh clone — the directory is
  # simply absent and `flutter build` stops with "unable to find directory
  # entry in pubspec.yaml" (verified by deleting one). The `.gitkeep` in each
  # zone is what survives the clone; it is bundled as an asset itself, which
  # costs nothing and is why `assets/backgrounds/` has shipped empty since the
  # arena work.
  #
  # ⭐ **All five Primal zones are declared before any of their art exists.**
  # Four of them are empty today. A creature with no PNG falls back (see
  # `CreatureView`), so listing the directory early costs a zero-byte asset and
  # means the maintainer's PNGs load the moment they land — no pubspec edit, no
  # rebuild-the-plumbing step, nothing between the art and the screen.
  # `test/creature_art_test.dart` asserts this list and the directories agree.
  # (The same contract covers assets/items/<zone>/ — icons, one per def.)
  assets:
    - assets/creatures/whispering_woods/
    - assets/creatures/glimmerbrook/
    - assets/creatures/cinderpeak_foothills/
    - assets/creatures/thornmire/
    - assets/creatures/ashfall_vale/
    - assets/backgrounds/
    # One per Primal zone, matching `ItemCatalogue.byZone`'s keys. Empty until
    # `tool/pixelate.py --mode icon` is run; `ItemIcon` falls back silently
    # meanwhile (test/item_icon_test.dart holds that true).
    - assets/items/whispering_woods/
    - assets/items/glimmerbrook/
    - assets/items/cinderpeak_foothills/
    - assets/items/thornmire/
    - assets/items/ashfall_vale/
