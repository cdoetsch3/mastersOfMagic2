<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Masters of Magic 2 — a simultaneous-turn elemental mage-duel game.">

  <!--
    ⚠️ Deliberate, load-bearing, and absent from Flutter's own template — do
    not remove. Without a viewport meta the browser lays the page out on a
    legacy ~980px viewport and picks a page scale at FIRST PAINT, before the
    Flutter engine boots and injects its own meta. That initial scale is
    computed for whichever orientation the app happened to LOAD in, and mobile
    Safari preserves it across rotations — so an app opened in portrait and
    rotated to landscape renders at the new size while pointer events keep the
    stale scale: every tap lands offset from what it visually hits. (Reported
    from device testing 2026-07-28: hitboxes wrong after portrait→landscape,
    fine when loaded in landscape.) Declaring the viewport up front means the
    first paint is already at device width, so there is no stale scale to
    inherit. user-scalable=no matches what the engine enforces anyway — page
    pinch-zoom would break hit testing the same way; viewport-fit=cover lets
    landscape content extend around the notch (SafeArea handles the rest).
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Masters of Magic 2">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Masters of Magic 2</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
